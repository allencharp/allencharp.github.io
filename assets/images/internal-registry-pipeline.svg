<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 500" width="100%" role="img">
  <title>Internal registry mirror pipeline with poisoning and vulnerability scanning</title>
  <desc>External image is pulled into a pipeline that runs two scans in sequence: a poisoning scan checks for supply-chain tampering and malicious artifacts, then a vulnerability scan checks for known CVEs. Only images passing both scans are pushed to the internal registry and made available for deployment.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 400; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 500; }
    </style>
  </defs>

  <!-- Title -->
  <text class="t" x="340" y="28" text-anchor="middle" fill="#AFA9EC">Internal registry mirror pipeline</text>

  <!-- ========== External registry ========== -->
  <text class="th" x="120" y="58" text-anchor="middle" fill="#7F77DD">External registry</text>

  <g>
    <rect x="40" y="72" width="160" height="44" rx="8" fill="#26215C" stroke="#7F77DD" stroke-width="0.5"/>
    <text class="th" x="120" y="94" text-anchor="middle" dominant-baseline="central" fill="#CECBF6">Docker Hub / GHCR</text>
  </g>

  <!-- Arrow right -->
  <path d="M200 94 L242 94" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== Mirror pipeline ========== -->
  <text class="th" x="340" y="58" text-anchor="middle" fill="#7F77DD">Mirror pipeline</text>

  <!-- Pull image -->
  <g>
    <rect x="250" y="72" width="180" height="44" rx="8" fill="#26215C" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="340" y="94" text-anchor="middle" dominant-baseline="central" fill="#B5D4F4">Pull image</text>
  </g>

  <!-- Arrow down -->
  <path d="M340 116 L340 138" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Poisoning scan -->
  <g>
    <rect x="250" y="148" width="180" height="56" rx="8" fill="#26215C" stroke="#EF9F27" stroke-width="0.5"/>
    <text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central" fill="#FAC775">Poisoning scan</text>
    <text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="#BA7517">tamper check / sig verify</text>
  </g>

  <!-- Arrow down -->
  <path d="M340 204 L340 226" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Vulnerability scan -->
  <g>
    <rect x="250" y="236" width="180" height="56" rx="8" fill="#26215C" stroke="#D4537E" stroke-width="0.5"/>
    <text class="th" x="340" y="260" text-anchor="middle" dominant-baseline="central" fill="#F4C0D1">Vulnerability scan</text>
    <text class="ts" x="340" y="278" text-anchor="middle" dominant-baseline="central" fill="#993556">Trivy / Grype / Snyk</text>
  </g>

  <!-- Arrow right to internal registry -->
  <path d="M430 264 L470 264" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== Internal registry ========== -->
  <text class="th" x="560" y="58" text-anchor="middle" fill="#7F77DD">Internal registry</text>

  <g>
    <rect x="480" y="236" width="160" height="56" rx="8" fill="#26215C" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="560" y="260" text-anchor="middle" dominant-baseline="central" fill="#9FE1CB">Push to internal</text>
    <text class="ts" x="560" y="278" text-anchor="middle" dominant-baseline="central" fill="#5DCAA5">Harbor / Nexus / Artifactory</text>
  </g>

  <!-- ========== Fail paths ========== -->
  <!-- Poisoning fail -->
  <path d="M250 176 L210 176 L210 308 L190 308" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="230" y="170" text-anchor="middle" fill="#F09595">fail</text>

  <!-- Vulnerability fail -->
  <path d="M250 264 L230 264 L230 308 L190 308" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="240" y="258" text-anchor="middle" fill="#F09595">fail</text>

  <!-- Block & alert -->
  <g>
    <rect x="40" y="292" width="160" height="44" rx="8" fill="#501313" stroke="#E24B4A" stroke-width="0.5"/>
    <text class="th" x="120" y="314" text-anchor="middle" dominant-baseline="central" fill="#F7C1C1">Block &amp; alert</text>
  </g>

  <!-- ========== Deploy path ========== -->
  <path d="M560 292 L560 320" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="480" y="332" width="160" height="44" rx="8" fill="#173404" stroke="#639922" stroke-width="0.5"/>
    <text class="th" x="560" y="354" text-anchor="middle" dominant-baseline="central" fill="#C0DD97">Available for deploy</text>
  </g>

  <!-- ========== Policy note ========== -->
  <line x1="40" y1="404" x2="640" y2="404" stroke="#444441" stroke-width="0.5"/>
  <text class="th" x="340" y="428" text-anchor="middle" fill="#CECBF6">Deployment policy: only internal registry images allowed</text>
  <text class="ts" x="340" y="448" text-anchor="middle" fill="#888780">K8s admission controller rejects any image not from the internal registry namespace.</text>
  <text class="ts" x="340" y="468" text-anchor="middle" fill="#888780">This ensures every running container has passed both scans.</text>
</svg>
