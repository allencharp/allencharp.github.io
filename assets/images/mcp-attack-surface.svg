<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 190" width="100%" role="img">
  <title>MCP attack surface</title>
  <desc>A model calls tools through an MCP client and an MCP server. Four threats: tool-output injection, excessive agency, malicious servers, and credential leaks.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="th" x="340" y="26" text-anchor="middle" dominant-baseline="central" fill="#444441">MCP attack surface</text>

  <rect x="40" y="48" width="120" height="44" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text class="th" x="100" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Model</text>

  <rect x="200" y="48" width="120" height="44" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="260" y="70" text-anchor="middle" dominant-baseline="central" fill="#444441">MCP client</text>

  <rect x="360" y="48" width="120" height="44" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="420" y="70" text-anchor="middle" dominant-baseline="central" fill="#444441">MCP server</text>

  <rect x="520" y="48" width="120" height="44" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="580" y="70" text-anchor="middle" dominant-baseline="central" fill="#444441">Tools / data</text>

  <line x1="160" y1="70" x2="196" y2="70" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="320" y1="70" x2="356" y2="70" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="480" y1="70" x2="516" y2="70" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="40" y="128" width="141" height="40" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text class="ts" x="110" y="148" text-anchor="middle" dominant-baseline="central" fill="#791F1F">1 · Output injection</text>

  <rect x="193" y="128" width="141" height="40" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text class="ts" x="263" y="148" text-anchor="middle" dominant-baseline="central" fill="#791F1F">2 · Excessive agency</text>

  <rect x="346" y="128" width="141" height="40" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text class="ts" x="416" y="148" text-anchor="middle" dominant-baseline="central" fill="#791F1F">3 · Malicious server</text>

  <rect x="499" y="128" width="141" height="40" rx="10" fill="#FCEBEB" stroke="#E24B4A" stroke-width="1"/>
  <text class="ts" x="569" y="148" text-anchor="middle" dominant-baseline="central" fill="#791F1F">4 · Credential leak</text>
</svg>
