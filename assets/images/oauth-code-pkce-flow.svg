<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 400" width="100%" role="img">
  <title>Authorization code flow with PKCE between client, authorization server and resource server</title>
  <desc>Six steps: authorize with a code challenge and state, receive a short lived code, redeem it with the code verifier, receive a short access token plus a rotating refresh token, call the resource server with a bearer token, and have the resource server verify signature, audience and expiry before checking object ownership.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="t" x="340" y="24" text-anchor="middle" fill="#444441">Authorization code + PKCE, and where each control lives</text>

  <g>
    <rect x="40" y="48" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Client</text>
  </g>

  <g>
    <rect x="255" y="48" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Authorization server</text>
  </g>

  <g>
    <rect x="470" y="48" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="555" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Resource server</text>
  </g>

  <path d="M125 92 L125 314" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M340 92 L340 314" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M555 92 L555 314" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <text class="ts" x="233" y="107" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">1 /authorize + code_challenge</text>
  <path d="M133 118 L337 118" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="450" y="152" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">2 code back — one-time, 60s</text>
  <path d="M332 163 L133 163" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="233" y="197" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">3 /token + code_verifier</text>
  <path d="M133 208 L337 208" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="450" y="242" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">4 short access, rotating refresh</text>
  <path d="M332 253 L133 253" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="145" y="287" dominant-baseline="central" fill="#5F5E5A">5 Authorization: Bearer</text>
  <path d="M133 298 L547 298" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <path d="M555 316 L555 334" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="470" y="336" width="170" height="44" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="555" y="351" text-anchor="middle" dominant-baseline="central" fill="#085041">verify sig, aud, exp</text>
    <text class="ts" x="555" y="368" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">then check ownership</text>
  </g>
</svg>
