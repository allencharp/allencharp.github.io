<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 320" width="100%" role="img">
  <title>With Google login, OAuth gives an access_token, OIDC also gives an id_token</title>
  <desc>Plain OAuth gives GitHub an access_token so it can call Google's APIs, but the token carries no identity. OIDC additionally returns an id_token carrying sub, telling GitHub exactly who signed in. Google authenticates the user in both cases; OAuth simply never reports that result to the app.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="th" x="340" y="28" text-anchor="middle" dominant-baseline="central" fill="#444441">One login, two outcomes</text>

  <!-- OAuth access_token card -->
  <rect x="30" y="44" width="290" height="176" rx="12" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <circle cx="60" cy="76" r="8" fill="none" stroke="#0C447C" stroke-width="2"/>
  <path d="M68 76 L86 76 M80 76 L80 82 M86 76 L86 82" fill="none" stroke="#0C447C" stroke-width="2.5" stroke-linecap="round"/>
  <text class="th" x="104" y="82" dominant-baseline="central" fill="#0C447C">OAuth — access_token</text>
  <line x1="50" y1="104" x2="300" y2="104" stroke="#378ADD" stroke-width="0.5" opacity="0.5"/>
  <text class="t" x="50" y="132" fill="#444441">lets GitHub call Google APIs</text>
  <text class="ts" x="50" y="158" fill="#444441">no identity inside it</text>
  <text class="ts" x="50" y="184" fill="#444441">whoever holds it can act</text>

  <!-- OIDC id_token card -->
  <rect x="360" y="44" width="290" height="176" rx="12" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <circle cx="394" cy="72" r="8" fill="#085041"/>
  <path d="M382 90 a12 14 0 0 1 24 0 Z" fill="#085041"/>
  <text class="th" x="438" y="82" dominant-baseline="central" fill="#085041">OIDC — id_token</text>
  <line x1="380" y1="104" x2="630" y2="104" stroke="#1D9E75" stroke-width="0.5" opacity="0.5"/>
  <text class="t" x="380" y="132" fill="#444441">tells GitHub who you are</text>
  <text class="ts" x="380" y="158" fill="#444441">carries sub / email / name</text>
  <text class="ts" x="380" y="184" fill="#444441">opens no API by itself</text>

  <!-- bottom note -->
  <rect x="30" y="242" width="620" height="78" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="48" y="266" fill="#444441">Google checks your password and 2FA in both cases — it authenticates you either way.</text>
  <text class="ts" x="48" y="288" fill="#444441">OAuth never reports that result to the app. OIDC writes it into</text>
  <text class="ts" x="48" y="308" fill="#444441">the id_token, so GitHub learns who signed in.</text>
</svg>
