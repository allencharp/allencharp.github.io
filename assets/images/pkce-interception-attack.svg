<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 368" width="100%" role="img">
  <title>Authorization code interception against a public client</title>
  <desc>A malicious app that declares the same custom scheme receives the authorization code, then redeems it at the token endpoint using nothing but the public client_id, because a native app cannot hold a client secret.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="t" x="340" y="24" text-anchor="middle" fill="#444441">Interception: the code never reaches the app that asked for it</text>

  <g>
    <rect x="40" y="48" width="170" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="125" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Client</text>
  </g>

  <g>
    <rect x="255" y="48" width="170" height="44" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
    <text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Malicious app</text>
  </g>

  <g>
    <rect x="470" y="48" width="170" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="555" y="70" text-anchor="middle" dominant-baseline="central" fill="#444441">Authorization server</text>
  </g>

  <path d="M125 92 L125 276" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M340 92 L340 276" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>
  <path d="M555 92 L555 276" fill="none" stroke="#B4B2A9" stroke-width="0.5" stroke-dasharray="3 3"/>

  <text class="ts" x="145" y="107" dominant-baseline="central" fill="#5F5E5A">1 /authorize via system browser</text>
  <path d="M133 118 L547 118" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="358" y="152" dominant-baseline="central" fill="#A32D2D">2 code lands on the wrong app</text>
  <path d="M547 163 L348 163" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="358" y="197" dominant-baseline="central" fill="#A32D2D">3 /token — code + client_id</text>
  <path d="M348 208 L547 208" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <text class="ts" x="358" y="242" dominant-baseline="central" fill="#A32D2D">4 token issued for the victim</text>
  <path d="M547 253 L348 253" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="40" y="296" width="600" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="58" y="316" dominant-baseline="central" fill="#444441">Why step 3 succeeds: a native app is a public client</text>
    <text class="ts" x="58" y="335" dominant-baseline="central" fill="#5F5E5A">no client_secret survives in a shipped binary, so /token accepts the public client_id alone</text>
  </g>
</svg>
