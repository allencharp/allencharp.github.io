<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 222" width="100%" role="img">
  <title>Six gates an API request passes through</title>
  <desc>A request crosses six layers in order: transport, authentication, authorization, input and output, abuse controls, and audit. Each layer answers one question.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="t" x="340" y="24" text-anchor="middle" fill="#444441">Every request passes six gates, in this order</text>

  <g>
    <rect x="40" y="50" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="130" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">1 Transport</text>
    <text class="ts" x="130" y="88" text-anchor="middle" dominant-baseline="central" fill="#185FA5">TLS everywhere, HSTS</text>
  </g>

  <g>
    <rect x="250" y="50" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="340" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">2 Authentication</text>
    <text class="ts" x="340" y="88" text-anchor="middle" dominant-baseline="central" fill="#185FA5">who are you</text>
  </g>

  <g>
    <rect x="460" y="50" width="180" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="550" y="70" text-anchor="middle" dominant-baseline="central" fill="#0C447C">3 Authorization</text>
    <text class="ts" x="550" y="88" text-anchor="middle" dominant-baseline="central" fill="#185FA5">can you touch this object</text>
  </g>

  <path d="M224 78 L246 78" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M434 78 L456 78" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M550 108 L550 144" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <g>
    <rect x="460" y="146" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="550" y="166" text-anchor="middle" dominant-baseline="central" fill="#085041">4 Input and output</text>
    <text class="ts" x="550" y="184" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">allowlist, redaction</text>
  </g>

  <g>
    <rect x="250" y="146" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="340" y="166" text-anchor="middle" dominant-baseline="central" fill="#085041">5 Abuse controls</text>
    <text class="ts" x="340" y="184" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">rate limit, idempotency</text>
  </g>

  <g>
    <rect x="40" y="146" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="130" y="166" text-anchor="middle" dominant-baseline="central" fill="#085041">6 Audit</text>
    <text class="ts" x="130" y="184" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">logs, alerts, inventory</text>
  </g>

  <path d="M456 174 L434 174" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M246 174 L224 174" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
