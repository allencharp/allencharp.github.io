<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 318" width="100%" role="img">
  <title>The front channel and the back channel have different trust properties</title>
  <desc>The front channel ends at a custom scheme picked by the operating system, which any app can claim. The back channel is a direct TLS connection from the client process to the authorization server, isolated from other apps by the OS sandbox.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="40" y="36" width="290" height="262" rx="12" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="th" x="60" y="60" dominant-baseline="central" fill="#444441">Front channel — browser redirect</text>

  <rect x="60" y="76" width="250" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="185" y="98" text-anchor="middle" dominant-baseline="central" fill="#444441">browser address bar</text>

  <path d="M185 120 L185 148" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="150" width="250" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="185" y="169" text-anchor="middle" dominant-baseline="central" fill="#444441">OS scheme routing</text>
  <text class="ts" x="185" y="188" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">shared namespace, no sandbox</text>

  <path d="M185 202 L185 230" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="232" width="250" height="52" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text class="th" x="185" y="251" text-anchor="middle" dominant-baseline="central" fill="#791F1F">destination chosen by the OS</text>
  <text class="ts" x="185" y="270" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">another app may receive it</text>

  <rect x="350" y="36" width="290" height="262" rx="12" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="th" x="370" y="60" dominant-baseline="central" fill="#444441">Back channel — direct call</text>

  <rect x="370" y="76" width="250" height="44" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="ts" x="495" y="98" text-anchor="middle" dominant-baseline="central" fill="#444441">call from inside the app</text>

  <path d="M495 120 L495 148" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="150" width="250" height="52" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="495" y="169" text-anchor="middle" dominant-baseline="central" fill="#444441">TLS 1.3 direct connection</text>
  <text class="ts" x="495" y="188" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">server certificate validated</text>

  <path d="M495 202 L495 230" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="232" width="250" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="495" y="251" text-anchor="middle" dominant-baseline="central" fill="#085041">only the AS can decrypt</text>
  <text class="ts" x="495" y="270" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">OS sandbox blocks other apps</text>
</svg>
