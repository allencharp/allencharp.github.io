<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 460" width="100%" role="img">
  <title>Kubernetes admission control image signature verification flow</title>
  <desc>When a Pod is created in Kubernetes, the API server sends the request to an admission webhook (Kyverno or OPA Gatekeeper), which verifies the image signature against a trusted public key. Valid signatures allow the Pod to be created; invalid or missing signatures are rejected before the container ever starts.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 400; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 500; }
    </style>
  </defs>

  <!-- Title -->
  <text class="t" x="340" y="28" text-anchor="middle" fill="#3C3489">Kubernetes admission control: image signature verification</text>

  <!-- ========== Left column: User action ========== -->
  <text class="th" x="120" y="58" text-anchor="middle" fill="#534AB7">User</text>

  <!-- kubectl apply -->
  <g>
    <rect x="40" y="72" width="160" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="120" y="94" text-anchor="middle" dominant-baseline="central" fill="#0C447C">kubectl apply</text>
  </g>

  <!-- Arrow down -->
  <path d="M120 116 L120 138" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Pod spec with image ref -->
  <g>
    <rect x="40" y="148" width="160" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="120" y="172" text-anchor="middle" dominant-baseline="central" fill="#444441">Pod spec</text>
    <text class="ts" x="120" y="190" text-anchor="middle" dominant-baseline="central" fill="#5F5E5A">image: app@sha256:3f9a</text>
  </g>

  <!-- Arrow right to API Server -->
  <path d="M200 176 L242 176" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== Middle column: API Server + Webhook ========== -->
  <text class="th" x="340" y="58" text-anchor="middle" fill="#534AB7">Control plane</text>

  <!-- API Server -->
  <g>
    <rect x="250" y="72" width="180" height="44" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="340" y="94" text-anchor="middle" dominant-baseline="central" fill="#0C447C">API server</text>
  </g>

  <!-- Arrow down -->
  <path d="M340 116 L340 138" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Admission Webhook -->
  <g>
    <rect x="250" y="148" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="340" y="172" text-anchor="middle" dominant-baseline="central" fill="#085041">Admission webhook</text>
    <text class="ts" x="340" y="190" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">Kyverno / OPA Gatekeeper</text>
  </g>

  <!-- Arrow down -->
  <path d="M340 204 L340 226" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- Verify signature -->
  <g>
    <rect x="250" y="236" width="180" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="0.5"/>
    <text class="th" x="340" y="260" text-anchor="middle" dominant-baseline="central" fill="#854F0B">Verify image signature</text>
    <text class="ts" x="340" y="278" text-anchor="middle" dominant-baseline="central" fill="#633806">cosign.pub / policy.json</text>
  </g>

  <!-- Decision arrows -->
  <path d="M250 264 L210 264 L210 320 L190 320" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M430 264 L470 264 L470 320 L490 320" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <!-- ========== Bottom: Pass / Fail ========== -->
  <!-- Allow: Pod created -->
  <g>
    <rect x="40" y="308" width="160" height="56" rx="8" fill="#EAF3DE" stroke="#639922" stroke-width="0.5"/>
    <text class="th" x="120" y="332" text-anchor="middle" dominant-baseline="central" fill="#27500A">Allow</text>
    <text class="ts" x="120" y="350" text-anchor="middle" dominant-baseline="central" fill="#3B6D11">Pod created, container starts</text>
  </g>

  <!-- Reject: admission denied -->
  <g>
    <rect x="480" y="308" width="160" height="56" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
    <text class="th" x="560" y="332" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Reject</text>
    <text class="ts" x="560" y="350" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">Admission denied, Pod blocked</text>
  </g>

  <!-- ========== Key insight callout ========== -->
  <line x1="40" y1="390" x2="640" y2="390" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="th" x="340" y="414" text-anchor="middle" fill="#534AB7">Key insight: verification happens before the container starts</text>
  <text class="ts" x="340" y="434" text-anchor="middle" fill="#5F5E5A">The image never runs on a node if the signature check fails — the Pod is blocked at the API server.</text>
</svg>
