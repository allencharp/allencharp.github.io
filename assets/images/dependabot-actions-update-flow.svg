<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 306" width="100%" role="img">
  <title>How Dependabot keeps pinned actions current</title>
  <desc>Committing .github/dependabot.yml with the github-actions ecosystem makes Dependabot scan every uses: line weekly, compare it against upstream tags, and open a pull request that rewrites both the commit SHA and the version comment.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="t" x="340" y="26" text-anchor="middle" fill="#3C3489">Pinning is not the end of updating</text>

  <g>
    <rect x="40" y="46" width="600" height="56" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
    <text class="th" x="58" y="68" dominant-baseline="central" fill="#444441">Commit one file</text>
    <text class="mono" x="58" y="88" dominant-baseline="central" fill="#5F5E5A">.github/dependabot.yml — ecosystem: github-actions, interval: weekly</text>
  </g>

  <path d="M60 102 L60 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="76" y="112" dominant-baseline="central" fill="#5F5E5A">every week</text>

  <g>
    <rect x="40" y="126" width="600" height="56" rx="8" fill="#E6F1FB" stroke="#378ADD" stroke-width="0.5"/>
    <text class="th" x="58" y="148" dominant-baseline="central" fill="#0C447C">Dependabot reads your workflows</text>
    <text class="ts" x="58" y="168" dominant-baseline="central" fill="#185FA5">every uses: line is compared against the tags published upstream</text>
  </g>

  <path d="M60 182 L60 202" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text class="ts" x="76" y="192" dominant-baseline="central" fill="#5F5E5A">a newer tag exists</text>

  <g>
    <rect x="40" y="206" width="600" height="56" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
    <text class="th" x="58" y="228" dominant-baseline="central" fill="#085041">You get a pull request</text>
    <text class="ts" x="58" y="248" dominant-baseline="central" fill="#0F6E56">the SHA and the trailing # v4 comment both change — reviewable, never silent</text>
  </g>

  <text class="ts" x="40" y="286" dominant-baseline="central" fill="#5F5E5A">That is the entire config: what to scan, and how often. Actions have no version range to tune.</text>
</svg>
