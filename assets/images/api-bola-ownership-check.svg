<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 266" width="100%" role="img">
  <title>Broken object level authorization versus a proper ownership check</title>
  <desc>Checking only that the caller is logged in returns another user's order. Checking whether the object belongs to the caller returns 403 Forbidden.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .t { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 13px; font-weight: 400; }
      .mono { font-family: var(--font-mono, monospace); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <rect x="40" y="36" width="290" height="210" rx="12" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="th" x="60" y="60" dominant-baseline="central" fill="#444441">Broken — only the login state is checked</text>

  <rect x="60" y="76" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="185" y="96" text-anchor="middle" dominant-baseline="central" fill="#444441">GET /orders/1002</text>

  <path d="M185 116 L185 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="126" width="250" height="52" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text class="th" x="185" y="145" text-anchor="middle" dominant-baseline="central" fill="#791F1F">Am I logged in?</text>
  <text class="ts" x="185" y="164" text-anchor="middle" dominant-baseline="central" fill="#A32D2D">yes — allow the request</text>

  <path d="M185 178 L185 184" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="60" y="188" width="250" height="40" rx="8" fill="#FCEBEB" stroke="#E24B4A" stroke-width="0.5"/>
  <text class="ts" x="185" y="208" text-anchor="middle" dominant-baseline="central" fill="#791F1F">200 OK — another user's order</text>

  <rect x="350" y="36" width="290" height="210" rx="12" fill="none" stroke="#D3D1C7" stroke-width="0.5"/>
  <text class="th" x="370" y="60" dominant-baseline="central" fill="#444441">Fixed — ownership is also checked</text>

  <rect x="370" y="76" width="250" height="40" rx="8" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="mono" x="495" y="96" text-anchor="middle" dominant-baseline="central" fill="#444441">GET /orders/1002</text>

  <path d="M495 116 L495 122" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="126" width="250" height="52" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="th" x="495" y="145" text-anchor="middle" dominant-baseline="central" fill="#085041">Does order 1002 belong to me?</text>
  <text class="ts" x="495" y="164" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">no — reject the request</text>

  <path d="M495 178 L495 184" fill="none" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="370" y="188" width="250" height="40" rx="8" fill="#E1F5EE" stroke="#1D9E75" stroke-width="0.5"/>
  <text class="ts" x="495" y="208" text-anchor="middle" dominant-baseline="central" fill="#085041">403 Forbidden</text>
</svg>
