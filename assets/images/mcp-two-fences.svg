<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 124" width="100%" role="img">
  <title>MCP needs two fences</title>
  <desc>A model is gated by a client-side fence that limits exposure and requires human approval, then a server-side fence that enforces least privilege and scope, before reaching the tools.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5"
      markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke"
        stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    </marker>
    <style>
      .th { font-family: var(--font-sans, sans-serif); font-size: 14px; font-weight: 500; }
      .ts { font-family: var(--font-sans, sans-serif); font-size: 12px; font-weight: 400; }
    </style>
  </defs>

  <text class="th" x="340" y="24" text-anchor="middle" dominant-baseline="central" fill="#444441">MCP needs two fences</text>

  <rect x="40" y="48" width="90" height="56" rx="10" fill="#E6F1FB" stroke="#378ADD" stroke-width="1"/>
  <text class="th" x="85" y="76" text-anchor="middle" dominant-baseline="central" fill="#0C447C">Model</text>

  <rect x="163" y="48" width="170" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text class="th" x="248" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Client fence</text>
  <text class="ts" x="248" y="88" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">least exposure · approval</text>

  <rect x="366" y="48" width="170" height="56" rx="10" fill="#E1F5EE" stroke="#1D9E75" stroke-width="1"/>
  <text class="th" x="451" y="68" text-anchor="middle" dominant-baseline="central" fill="#085041">Server fence</text>
  <text class="ts" x="451" y="88" text-anchor="middle" dominant-baseline="central" fill="#0F6E56">least privilege · scope</text>

  <rect x="569" y="48" width="71" height="56" rx="10" fill="#F1EFE8" stroke="#888780" stroke-width="0.5"/>
  <text class="th" x="604" y="76" text-anchor="middle" dominant-baseline="central" fill="#444441">Tools</text>

  <line x1="130" y1="76" x2="160" y2="76" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="333" y1="76" x2="363" y2="76" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="536" y1="76" x2="566" y2="76" stroke="#888780" stroke-width="1.5" marker-end="url(#arrow)"/>
</svg>
