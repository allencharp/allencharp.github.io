---
layout: default
---

<h1>Posts</h1>

<ul class="post-list">
  {% for post in site.posts %}
    <li>
      <a class="post-link" href="{{ post.url | relative_url }}">{{ post.title }}</a>
      <span class="post-meta">{{ post.date | date: "%-d %B %Y" }}{% if post.tags %} · {{ post.tags | join: " · " }}{% endif %}</span>
    </li>
  {% endfor %}
</ul>
